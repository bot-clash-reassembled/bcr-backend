name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      is_version_tag: ${{ steps.tag_validation.outputs.is_version_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run tests
        run: poetry run python -m unittest discover -s test
        env:
          PYTHONPATH: src

      - name: Validate version tag
        id: tag_validation
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
            echo "is_version_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_version_tag=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    if: needs.test.outputs.is_version_tag == 'true'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/bcr-backend
          tags: type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
